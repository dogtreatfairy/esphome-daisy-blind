# ---------------------------------------------------------------------------
# Daisy Blind - core configuration
#
# Daisy-chained stepper blind controller for ESP8266 NodeMCU + A4988 + 28BYJ-48.
# This is the file the ESPHome dashboard imports when you adopt a device; it is
# also included by daisy-blind.factory.yaml to build the pre-compiled firmware.
#
# Each board gets a unique hostname from its MAC address (daisy-blind-xxxxxx).
# Everything else - label, direction, open and closed limits, group, firing
# order - is set at runtime from the device's own web page or Home Assistant.
#
# Wiring follows The Hookup's BlindsMCU:  D7 = STEP, D6 = DIR, D5 = ENABLE.
# https://github.com/dogtreatfairy/esphome-daisy-blind
# ---------------------------------------------------------------------------

esphome:
  name: daisy-blind
  friendly_name: Daisy Blind
  # One firmware for every blind: the MAC is appended to the hostname.
  name_add_mac_suffix: true
  project:
    name: dogtreatfairy.daisy-blind
    version: "26.9.3"  # stamped by the Release workflow; factory builds override it
  # Push restored settings into the controller once every entity has loaded.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(blind).set_open_steps((int32_t) id(open_limit).state);
          id(blind).set_closed_steps((int32_t) id(closed_limit).state);
          id(blind).set_speed((int32_t) id(motor_speed).state);
          id(blind).set_group((int32_t) id(sync_group).state);
          id(blind).set_order((int32_t) id(firing_order).state);
          id(blind).set_one_at_a_time(id(coordination_mode).active_index().value_or(0) == 1);
          id(blind).set_invert_direction(id(invert_direction).state);
          id(blind).set_group_control(id(group_control).state);
          id(blind).set_label(id(blind_label).state);

esp8266:
  board: nodemcuv2
  restore_from_flash: true   # settings and position survive power loss

preferences:
  flash_write_interval: 5s   # position reaches flash within 5 s of a change

external_components:
  - source: github://dogtreatfairy/esphome-daisy-blind@main
    components: [daisy_blind]

# No credentials baked in. A fresh board starts an open access point named
# daisy-blind-xxxxxx; join it, pick your WiFi in the captive portal, and it
# reboots onto your network. Credentials are stored in flash.
#
# Fallback: if the known network can't be reached for 30 s the hotspot comes
# up, but the board keeps scanning for the known network the whole time and
# drops the hotspot as soon as it reconnects. While someone is using the
# captive portal the reconnect attempts back off so they don't disrupt setup.
# After a power cycle it always tries the known network first.
wifi:
  id: wifi_id
  power_save_mode: none
  ap:
    ap_timeout: 30s

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

# API is required for dashboard adoption. The ESPHome dashboard adds an
# encryption key to your copy of the config when you adopt the device.
api:
  reboot_timeout: 0s   # don't reboot just because Home Assistant isn't connected

ota:
  - platform: esphome
  - platform: web_server   # firmware upload form on the device page

# Version 3 interface: single-column layout that fits a phone, follows the
# phone's light/dark setting, and groups the controls into sections. Assets
# are embedded so the page works with no internet.
web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: sg_blind
      name: Blind
      sorting_weight: 10
    - id: sg_calibration
      name: Calibration
      sorting_weight: 20
    - id: sg_coordination
      name: Coordination
      sorting_weight: 30
    - id: sg_setup
      name: Setup
      sorting_weight: 40
    - id: sg_device
      name: Device
      sorting_weight: 50

# On-board LED (D4, active low) blinks while the board is not connected to a
# WiFi network, i.e. while the setup hotspot is up. Off once connected.
# Can be disabled with the "Hotspot LED" switch.
output:
  - platform: gpio
    id: led_out
    pin:
      number: D4
      inverted: true

interval:
  - interval: 250ms
    then:
      - lambda: |-
          static bool on = false;
          const bool blink = id(hotspot_led).state && !id(wifi_id).is_connected();
          on = blink && !on;
          if (on) {
            id(led_out).turn_on();
          } else {
            id(led_out).turn_off();
          }

# ---------------------------------------------------------------- the blind

cover:
  - platform: daisy_blind
    id: blind
    name: None            # takes the device's name in Home Assistant
    web_server:
      sorting_group_id: sg_blind
      sorting_weight: 1
    device_class: blind
    step_pin: D7
    dir_pin:
      number: D6
      inverted: true
    sleep_pin:            # wired to the A4988 ENABLE pin, hence inverted
      number: D5
      inverted: true
    port: 44820           # UDP port used for peer discovery and coordination

# ---------------------------------------------------------------- settings

text:
  - platform: template
    id: blind_label
    name: Label
    web_server:
      sorting_group_id: sg_setup
      sorting_weight: 1
    icon: mdi:tag-text
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 23
    entity_category: config
    on_value:
      - lambda: id(blind).set_label(x);

number:
  - platform: template
    id: sync_group
    name: Group
    web_server:
      sorting_group_id: sg_coordination
      sorting_weight: 1
    icon: mdi:account-group
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 9
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_group((int32_t) x);

  - platform: template
    id: firing_order
    name: Firing order
    web_server:
      sorting_group_id: sg_coordination
      sorting_weight: 2
    icon: mdi:sort-numeric-ascending
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 8
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_order((int32_t) x);

  - platform: template
    id: open_limit
    name: Open limit (steps)
    web_server:
      sorting_group_id: sg_calibration
      sorting_weight: 5
    icon: mdi:arrow-expand-up
    optimistic: true
    restore_value: true
    initial_value: 785
    min_value: -50000
    max_value: 50000
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_open_steps((int32_t) x);

  - platform: template
    id: closed_limit
    name: Closed limit (steps)
    web_server:
      sorting_group_id: sg_calibration
      sorting_weight: 4
    icon: mdi:arrow-collapse-down
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -50000
    max_value: 50000
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_closed_steps((int32_t) x);

  - platform: template
    id: motor_speed
    name: Motor speed (steps per second)
    web_server:
      sorting_group_id: sg_setup
      sorting_weight: 3
    icon: mdi:speedometer
    optimistic: true
    restore_value: true
    initial_value: 250
    min_value: 20
    max_value: 1000
    step: 10
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_speed((int32_t) x);

  - platform: template
    id: nudge_size
    name: Nudge size (steps)
    web_server:
      sorting_group_id: sg_blind
      sorting_weight: 4
    icon: mdi:ruler
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 500
    step: 1
    mode: box
    entity_category: config

  # Move the blind to an absolute step count (ignores the limits) for calibration.
  - platform: template
    id: manual_position
    name: Manual position (steps)
    web_server:
      sorting_group_id: sg_calibration
      sorting_weight: 1
    icon: mdi:target
    min_value: -50000
    max_value: 50000
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(blind).get_position_steps();
    set_action:
      - lambda: id(blind).move_to_steps((int32_t) x);

select:
  - platform: template
    id: coordination_mode
    name: Coordination mode
    web_server:
      sorting_group_id: sg_coordination
      sorting_weight: 3
    icon: mdi:engine
    optimistic: true
    restore_value: true
    initial_option: Take turns
    options: [Take turns, One at a time]
    entity_category: config
    on_value:
      - lambda: id(blind).set_one_at_a_time(i == 1);

switch:
  - platform: template
    id: invert_direction
    name: Invert direction
    web_server:
      sorting_group_id: sg_setup
      sorting_weight: 2
    icon: mdi:swap-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_invert_direction(true);
    on_turn_off:
      - lambda: id(blind).set_invert_direction(false);

  - platform: template
    id: hotspot_led
    name: Hotspot LED
    icon: mdi:led-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: sg_setup
      sorting_weight: 5

  - platform: template
    id: group_control
    name: Group control
    web_server:
      sorting_group_id: sg_setup
      sorting_weight: 4
    icon: mdi:link-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_group_control(true);
    on_turn_off:
      - lambda: id(blind).set_group_control(false);

button:
  - platform: template
    name: Nudge toward open
    web_server:
      sorting_group_id: sg_blind
      sorting_weight: 2
    icon: mdi:chevron-up
    on_press:
      - lambda: id(blind).nudge((int32_t) id(nudge_size).state);

  - platform: template
    name: Nudge toward closed
    web_server:
      sorting_group_id: sg_blind
      sorting_weight: 3
    icon: mdi:chevron-down
    on_press:
      - lambda: id(blind).nudge(-(int32_t) id(nudge_size).state);

  - platform: template
    name: Save current position as open limit
    web_server:
      sorting_group_id: sg_calibration
      sorting_weight: 3
    icon: mdi:content-save-move
    entity_category: config
    on_press:
      - number.set:
          id: open_limit
          value: !lambda return id(blind).get_position_steps();

  - platform: template
    name: Save current position as closed limit
    web_server:
      sorting_group_id: sg_calibration
      sorting_weight: 2
    icon: mdi:content-save-move-outline
    entity_category: config
    on_press:
      - number.set:
          id: closed_limit
          value: !lambda return id(blind).get_position_steps();

  - platform: restart
    name: Restart
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 8
    entity_category: diagnostic

  - platform: factory_reset
    name: Factory reset (forget WiFi)
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 9
    entity_category: diagnostic

# ---------------------------------------------------------------- readouts

text_sensor:
  - platform: template
    name: Peers in group
    web_server:
      sorting_group_id: sg_coordination
      sorting_weight: 5
    icon: mdi:lan
    update_interval: 5s
    lambda: return id(blind).peer_summary();

  - platform: template
    name: Coordination status
    web_server:
      sorting_group_id: sg_coordination
      sorting_weight: 4
    icon: mdi:engine-outline
    update_interval: 5s
    lambda: return id(blind).sync_status();

  - platform: wifi_info
    ip_address:
      name: IP address
      web_server:
        sorting_group_id: sg_device
        sorting_weight: 6
    ssid:
      name: SSID
      web_server:
        sorting_group_id: sg_device
        sorting_weight: 7

  - platform: template
    name: Firmware version
    icon: mdi:tag
    update_interval: never
    lambda: return {ESPHOME_PROJECT_VERSION};
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 2

  - platform: version
    name: ESPHome version
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 10

sensor:
  - platform: template
    name: Position (steps)
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 1
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return id(blind).get_position_steps();

  - platform: wifi_signal
    name: WiFi signal
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 5
    update_interval: 60s

binary_sensor:
  - platform: status
    name: Status
    web_server:
      sorting_group_id: sg_device
      sorting_weight: 4
