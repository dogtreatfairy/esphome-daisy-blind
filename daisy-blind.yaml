# ---------------------------------------------------------------------------
# Daisy Blind - core configuration
#
# Daisy-chained stepper blind controller for ESP8266 NodeMCU + A4988 + 28BYJ-48.
# This is the file the ESPHome dashboard imports when you adopt a device; it is
# also included by daisy-blind.factory.yaml to build the pre-compiled firmware.
#
# Each board gets a unique hostname from its MAC address (daisy-blind-xxxxxx).
# Everything else - label, direction, open and closed limits, homing distance,
# speed, sync group and slot - is set at runtime from the device's own web
# page or from Home Assistant.
#
# Wiring follows The Hookup's BlindsMCU:  D7 = STEP, D6 = DIR, D5 = ENABLE.
# https://github.com/dogtreatfairy/esphome-daisy-blind
# ---------------------------------------------------------------------------

esphome:
  name: daisy-blind
  friendly_name: Daisy Blind
  # One firmware for every blind: the MAC is appended to the hostname.
  name_add_mac_suffix: true
  # Push restored settings into the controller once every entity has loaded.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(blind).set_open_steps((int32_t) id(open_limit).state);
          id(blind).set_closed_steps((int32_t) id(closed_limit).state);
          id(blind).set_homing_steps((int32_t) id(homing_steps).state);
          id(blind).set_speed((int32_t) id(motor_speed).state);
          id(blind).set_slot_ms((int32_t) id(slot_length).state);
          id(blind).set_group((int32_t) id(sync_group).state);
          id(blind).set_slot_mode(id(sync_slot).active_index().value_or(0));
          id(blind).set_invert_direction(id(invert_direction).state);
          id(blind).set_sync_enabled(id(sync_enabled).state);
          id(blind).set_sleep_between_slots(id(sleep_between_slots).state);
          id(blind).set_home_on_boot(id(home_on_boot).state);
          id(blind).set_group_control(id(group_control).state);
          id(blind).set_label(id(blind_label).state);

esp8266:
  board: nodemcuv2
  restore_from_flash: true   # settings and position survive power loss

external_components:
  - source: github://dogtreatfairy/esphome-daisy-blind@main
    components: [daisy_blind]

# No credentials baked in. A fresh board starts an open access point named
# daisy-blind-xxxxxx; join it, pick your WiFi in the captive portal, and it
# reboots onto your network. Credentials are stored in flash.
wifi:
  power_save_mode: none
  ap: {}

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

# API is required for dashboard adoption. The ESPHome dashboard adds an
# encryption key to your copy of the config when you adopt the device.
api:
  reboot_timeout: 0s   # don't reboot just because Home Assistant isn't connected

ota:
  - platform: esphome
  - platform: web_server   # firmware upload form on the device page

web_server:
  port: 80

# ---------------------------------------------------------------- the blind

cover:
  - platform: daisy_blind
    id: blind
    name: None            # takes the device's name in Home Assistant
    device_class: blind
    step_pin: D7
    dir_pin:
      number: D6
      inverted: true
    sleep_pin:            # wired to the A4988 ENABLE pin, hence inverted
      number: D5
      inverted: true
    port: 44820           # UDP port used for peer discovery and sync

# ---------------------------------------------------------------- settings

text:
  - platform: template
    id: blind_label
    name: Label
    icon: mdi:tag-text
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 23
    entity_category: config
    on_value:
      - lambda: id(blind).set_label(x);

number:
  - platform: template
    id: open_limit
    name: Open limit (steps)
    icon: mdi:arrow-expand-up
    optimistic: true
    restore_value: true
    initial_value: 750
    min_value: 1
    max_value: 50000
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_open_steps((int32_t) x);

  - platform: template
    id: closed_limit
    name: Closed limit (steps from home)
    icon: mdi:arrow-collapse-down
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 50000
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_closed_steps((int32_t) x);

  - platform: template
    id: homing_steps
    name: Homing distance (steps)
    icon: mdi:home-import-outline
    optimistic: true
    restore_value: true
    initial_value: 1500
    min_value: 10
    max_value: 50000
    step: 10
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_homing_steps((int32_t) x);

  - platform: template
    id: motor_speed
    name: Motor speed (steps per second)
    icon: mdi:speedometer
    optimistic: true
    restore_value: true
    initial_value: 250
    min_value: 20
    max_value: 1000
    step: 10
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_speed((int32_t) x);

  - platform: template
    id: slot_length
    name: Sync slot length (ms)
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    initial_value: 250
    min_value: 50
    max_value: 2000
    step: 10
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_slot_ms((int32_t) x);

  - platform: template
    id: sync_group
    name: Sync group
    icon: mdi:account-group
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 9
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(blind).set_group((int32_t) x);

  # Jog the blind to an absolute step count (ignores the limits) for calibration.
  - platform: template
    id: manual_position
    name: Manual position (steps)
    icon: mdi:ruler
    min_value: -2000
    max_value: 50000
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(blind).get_position_steps();
    set_action:
      - lambda: id(blind).move_to_steps((int32_t) x);

select:
  - platform: template
    id: sync_slot
    name: Sync slot
    icon: mdi:view-sequential
    optimistic: true
    restore_value: true
    initial_option: Auto
    options: [Auto, "1", "2", "3", "4"]
    entity_category: config
    on_value:
      - lambda: id(blind).set_slot_mode((int32_t) i);

switch:
  - platform: template
    id: invert_direction
    name: Invert direction
    icon: mdi:swap-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_invert_direction(true);
    on_turn_off:
      - lambda: id(blind).set_invert_direction(false);

  - platform: template
    id: sync_enabled
    name: Sync with peers
    icon: mdi:sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_sync_enabled(true);
    on_turn_off:
      - lambda: id(blind).set_sync_enabled(false);

  - platform: template
    id: sleep_between_slots
    name: Sleep driver between slots
    icon: mdi:power-sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_sleep_between_slots(true);
    on_turn_off:
      - lambda: id(blind).set_sleep_between_slots(false);

  - platform: template
    id: home_on_boot
    name: Home after power loss
    icon: mdi:home-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_home_on_boot(true);
    on_turn_off:
      - lambda: id(blind).set_home_on_boot(false);

  - platform: template
    id: group_control
    name: Group control
    icon: mdi:link-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: id(blind).set_group_control(true);
    on_turn_off:
      - lambda: id(blind).set_group_control(false);

button:
  - platform: template
    name: Home now
    icon: mdi:home-import-outline
    on_press:
      - lambda: id(blind).home();

  - platform: template
    name: Home whole group
    icon: mdi:home-group
    on_press:
      - lambda: id(blind).home_group();

  - platform: template
    name: Save current position as open limit
    icon: mdi:content-save-move
    entity_category: config
    on_press:
      - number.set:
          id: open_limit
          value: !lambda return id(blind).get_position_steps();

  - platform: template
    name: Save current position as closed limit
    icon: mdi:content-save-move-outline
    entity_category: config
    on_press:
      - number.set:
          id: closed_limit
          value: !lambda return id(blind).get_position_steps();

  - platform: restart
    name: Restart
    entity_category: diagnostic

  - platform: factory_reset
    name: Factory reset (forget WiFi)
    entity_category: diagnostic

# ---------------------------------------------------------------- readouts

text_sensor:
  - platform: template
    name: Peers in group
    icon: mdi:lan
    update_interval: 5s
    lambda: return id(blind).peer_summary();

  - platform: template
    name: Sync status
    icon: mdi:sync-circle
    update_interval: 5s
    lambda: return id(blind).sync_status();

  - platform: wifi_info
    ip_address:
      name: IP address
    ssid:
      name: SSID

  - platform: version
    name: Firmware

sensor:
  - platform: template
    name: Position (steps)
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return id(blind).get_position_steps();

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s

binary_sensor:
  - platform: status
    name: Status
