# ---------------------------------------------------------------------------
# Daisy Blind - adoption entry point
#
# When you adopt a blind, the ESPHome dashboard writes a config that imports
# this file from GitHub. ESPHome caches that import for a day, so this file is
# kept tiny and stable: it just pulls the real configuration with a 1 s refresh.
# Any change pushed to daisy-blind-core.yaml or the component on main is picked
# up by the next Install, with no re-adoption.
# https://github.com/dogtreatfairy/esphome-daisy-blind
# ---------------------------------------------------------------------------

packages:
  daisy_blind_core:
    url: https://github.com/dogtreatfairy/esphome-daisy-blind
    ref: main
    files: [daisy-blind-core.yaml]
    refresh: 1s
